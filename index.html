<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>علی اور سارہ - محبت کی کہانی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 400 / 600;
            background: #87CEEB;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #uiOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 12px;
        }

        /* Dialogue Box */
        #dialogueBox {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #ffd700;
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 8px;
            min-height: 90px;
            max-height: 130px;
            display: none;
            backdrop-filter: blur(4px);
        }

        #speakerName {
            color: #ffd700;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
            text-shadow: 0 0 8px rgba(255,215,0,0.4);
        }

        #dialogueText {
            color: #fff;
            font-size: 15px;
            line-height: 1.5;
            text-shadow: 0 1px 4px rgba(0,0,0,0.6);
            min-height: 40px;
            word-break: break-word;
        }

        #continueHint {
            color: #aaa;
            font-size: 12px;
            text-align: center;
            margin-top: 6px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Choice Buttons */
        #choicesContainer {
            pointer-events: auto;
            display: none;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 8px;
        }

        .choice-btn {
            pointer-events: auto;
            background: linear-gradient(135deg, #2d2d5e, #1a1a3e);
            border: 2px solid #4a4a8a;
            border-radius: 12px;
            color: #fff;
            padding: 14px 18px;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .choice-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(100, 100, 255, 0.3);
        }

        .choice-btn.good {
            border-color: #4CAF50;
            background: linear-gradient(135deg, #1b3a1b, #2d5e2d);
        }

        .choice-btn.good:hover {
            border-color: #66bb6a;
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.3);
        }

        .choice-btn.bad {
            border-color: #f44336;
            background: linear-gradient(135deg, #3a1b1b, #5e2d2d);
        }

        .choice-btn.bad:hover {
            border-color: #ef5350;
            box-shadow: 0 6px 20px rgba(244, 67, 54, 0.3);
        }

        .choice-btn:active {
            transform: scale(0.97);
        }

        /* Title Screen */
        #titleScreen {
            pointer-events: auto;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(6px);
            z-index: 20;
        }

        #titleScreen h1 {
            color: #ffd700;
            font-size: 28px;
            text-align: center;
            margin-bottom: 8px;
            text-shadow: 0 0 30px rgba(255,215,0,0.3);
        }

        #titleScreen h2 {
            color: #fff;
            font-size: 16px;
            text-align: center;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        #startBtn {
            pointer-events: auto;
            background: linear-gradient(135deg, #ffd700, #ffb300);
            color: #1a1a2e;
            border: none;
            border-radius: 50px;
            padding: 16px 50px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.3);
        }

        #startBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 40px rgba(255, 215, 0, 0.5);
        }

        #startBtn:active {
            transform: scale(0.95);
        }

        /* Ending Overlay */
        #endingOverlay {
            pointer-events: auto;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(6px);
            z-index: 25;
            padding: 30px;
            text-align: center;
        }

        #endingOverlay .ending-icon {
            font-size: 60px;
            margin-bottom: 16px;
        }

        #endingOverlay h2 {
            color: #ffd700;
            font-size: 26px;
            margin-bottom: 12px;
        }

        #endingOverlay p {
            color: #ddd;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
            max-width: 320px;
        }

        #restartBtn {
            pointer-events: auto;
            background: linear-gradient(135deg, #ffd700, #ffb300);
            color: #1a1a2e;
            border: none;
            border-radius: 50px;
            padding: 14px 40px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        #restartBtn:hover {
            transform: scale(1.05);
        }

        /* Hearts particle */
        .heart {
            position: absolute;
            pointer-events: none;
            font-size: 20px;
            animation: floatUp 2s ease-out forwards;
            z-index: 30;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-120px) scale(0.3); }
        }

        /* Score display */
        #scoreDisplay {
            position: absolute;
            top: 12px;
            right: 12px;
            color: #fff;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,215,0,0.3);
            z-index: 10;
            pointer-events: none;
        }

        @media (max-width: 420px) {
            #gameContainer { max-width: 100%; border-radius: 0; }
            .choice-btn { padding: 12px 14px; font-size: 14px; }
            #dialogueBox { padding: 12px 14px; min-height: 80px; }
            #dialogueText { font-size: 14px; }
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    
    <div id="scoreDisplay">❤️ دوستی: <span id="score">0</span></div>

    <!-- UI Overlay -->
    <div id="uiOverlay">
        <div id="dialogueBox">
            <div id="speakerName">علی</div>
            <div id="dialogueText">یہاں کچھ لکھا ہوگا...</div>
            <div id="continueHint">👇 ٹیپ کریں جاری رکھنے کے لیے</div>
        </div>
        <div id="choicesContainer">
            <button class="choice-btn" data-choice="0"> choice 1</button>
            <button class="choice-btn" data-choice="1"> choice 2</button>
        </div>
    </div>

    <!-- Title -->
    <div id="titleScreen">
        <h1>🌸 علی اور سارہ 🌸</h1>
        <h2>ایک انتخاب... ایک محبت کی کہانی</h2>
        <button id="startBtn">✨ کہانی شروع کریں</button>
    </div>

    <!-- Ending -->
    <div id="endingOverlay">
        <div class="ending-icon" id="endingIcon">❤️</div>
        <h2 id="endingTitle">خوشی</h2>
        <p id="endingDesc">یہاں کہانی ختم ہوگی</p>
        <button id="restartBtn">🔄 دوبارہ کھیلیں</button>
    </div>
</div>

<script>
    // ========== SETUP ==========
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('gameContainer');

    let W, H;

    function resize() {
        const rect = container.getBoundingClientRect();
        canvas.width = 400;
        canvas.height = 600;
        W = 400;
        H = 600;
    }
    resize();
    window.addEventListener('resize', resize);

    // ========== DOM REFS ==========
    const dialogueBox = document.getElementById('dialogueBox');
    const speakerName = document.getElementById('speakerName');
    const dialogueText = document.getElementById('dialogueText');
    const continueHint = document.getElementById('continueHint');
    const choicesContainer = document.getElementById('choicesContainer');
    const titleScreen = document.getElementById('titleScreen');
    const startBtn = document.getElementById('startBtn');
    const endingOverlay = document.getElementById('endingOverlay');
    const endingIcon = document.getElementById('endingIcon');
    const endingTitle = document.getElementById('endingTitle');
    const endingDesc = document.getElementById('endingDesc');
    const restartBtn = document.getElementById('restartBtn');
    const scoreSpan = document.getElementById('score');

    // ========== GAME STATE ==========
    let score = 0;
    let scene = 'title'; // 'title' | 'playing' | 'dialogue' | 'choice' | 'ending'
    let currentDialogueIndex = 0;
    let currentDialogueLines = [];
    let typingTimer = null;
    let typedLength = 0;
    let isTyping = false;
    let skipToEnd = false;
    let choiceCallback = null;
    let frame = 0;

    // Character positions
    let ali = { x: 50, y: 420, targetX: 50, targetY: 420, speed: 2, walking: false, frame: 0 };
    let sara = { x: 250, y: 450, isSad: true };

    // Camera / scene objects
    let trees = [];
    let clouds = [];
    let flowers = [];
    let hearts = [];
    let particles = [];

    // ========== INIT SCENE ==========
    function initScene() {
        trees = [];
        for (let i = 0; i < 4; i++) {
            trees.push({
                x: 40 + i * 100 + Math.random() * 30,
                size: 40 + Math.random() * 30
            });
        }
        clouds = [];
        for (let i = 0; i < 3; i++) {
            clouds.push({
                x: Math.random() * 400,
                y: 30 + Math.random() * 50,
                speed: 0.2 + Math.random() * 0.3,
                w: 60 + Math.random() * 40
            });
        }
        flowers = [];
        for (let i = 0; i < 10; i++) {
            flowers.push({
                x: 20 + Math.random() * 360,
                y: 440 + Math.random() * 100,
                color: ['#ff6b9d', '#ffd700', '#ff69b4', '#ffa07a', '#da70d6'][Math.floor(Math.random() * 5)],
                size: 3 + Math.random() * 4
            });
        }
    }

    // ========== DRAWING FUNCTIONS ==========
    function drawSky() {
        const grad = ctx.createLinearGradient(0, 0, 0, 350);
        grad.addColorStop(0, '#4fc3f7');
        grad.addColorStop(0.5, '#81d4fa');
        grad.addColorStop(1, '#b3e5fc');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, 260);
    }

    function drawSun() {
        ctx.save();
        const grd = ctx.createRadialGradient(340, 50, 10, 340, 50, 60);
        grd.addColorStop(0, '#fff9c4');
        grd.addColorStop(0.3, '#ffeb3b');
        grd.addColorStop(1, 'rgba(255,235,59,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(340, 50, 60, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function drawClouds() {
        clouds.forEach(c => {
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.beginPath();
            ctx.ellipse(c.x, c.y, c.w / 2, 18, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(c.x - c.w * 0.3, c.y + 5, c.w * 0.35, 15, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(c.x + c.w * 0.3, c.y + 3, c.w * 0.3, 14, 0, 0, Math.PI * 2);
            ctx.fill();
            c.x += c.speed;
            if (c.x > W + 80) c.x = -80;
        });
    }

    function drawGround() {
        const grad = ctx.createLinearGradient(0, 350, 0, H);
        grad.addColorStop(0, '#4caf50');
        grad.addColorStop(0.3, '#388e3c');
        grad.addColorStop(0.7, '#2e7d32');
        grad.addColorStop(1, '#1b5e20');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 350, W, H - 350);

        // Grass detail
        ctx.strokeStyle = '#43a047';
        ctx.lineWidth = 2;
        for (let i = 0; i < 30; i++) {
            const gx = Math.random() * W;
            const gy = 355 + Math.random() * 220;
            ctx.beginPath();
            ctx.moveTo(gx, gy);
            ctx.quadraticCurveTo(gx - 3, gy - 12, gx - 6, gy - 8);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(gx + 2, gy);
            ctx.quadraticCurveTo(gx + 6, gy - 14, gx + 10, gy - 9);
            ctx.stroke();
        }
    }

    function drawPath() {
        ctx.fillStyle = '#8d6e63';
        ctx.beginPath();
        ctx.moveTo(0, 430);
        ctx.quadraticCurveTo(100, 420, 200, 435);
        ctx.quadraticCurveTo(300, 445, 400, 430);
        ctx.lineTo(400, 440);
        ctx.quadraticCurveTo(300, 455, 200, 445);
        ctx.quadraticCurveTo(100, 432, 0, 440);
        ctx.closePath();
        ctx.fill();
        
        ctx.fillStyle = '#795548';
        ctx.beginPath();
        ctx.moveTo(0, 432);
        ctx.quadraticCurveTo(100, 422, 200, 437);
        ctx.quadraticCurveTo(300, 447, 400, 432);
        ctx.lineWidth = 3;
    }

    function drawTrees() {
        trees.forEach(t => {
            // Trunk
            ctx.fillStyle = '#5d4037';
            ctx.fillRect(t.x - 6, 370 - t.size * 0.5, 12, t.size * 0.5 + 20);
            // Leaves
            ctx.fillStyle = '#2e7d32';
            ctx.beginPath();
            ctx.arc(t.x, 360 - t.size * 0.5, t.size * 0.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#388e3c';
            ctx.beginPath();
            ctx.arc(t.x - 10, 355 - t.size * 0.5, t.size * 0.35, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(t.x + 12, 352 - t.size * 0.5, t.size * 0.35, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    function drawBench() {
        // Bench at sara's position
        const bx = 240, by = 445;
        ctx.fillStyle = '#5d4037';
        ctx.fillRect(bx, by, 50, 8);
        ctx.fillRect(bx, by + 8, 50, 4);
        ctx.fillRect(bx, by + 12, 6, 20);
        ctx.fillRect(bx + 44, by + 12, 6, 20);
        ctx.fillStyle = '#4e342e';
        ctx.fillRect(bx - 2, by - 4, 54, 4);
    }

    function drawFlowers() {
        flowers.forEach(f => {
            ctx.fillStyle = '#4caf50';
            ctx.fillRect(f.x, f.y, 2, 12);
            ctx.fillStyle = f.color;
            ctx.beginPath();
            ctx.arc(f.x, f.y - 2, f.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffeb3b';
            ctx.beginPath();
            ctx.arc(f.x, f.y - 2, f.size * 0.4, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    function drawCharacter(x, y, isAli, isSad, walkFrame) {
        const scale = 1;
        const baseY = y;

        if (isAli) {
            // Body
            ctx.fillStyle = '#1565c0';
            ctx.fillRect(x - 10 * scale, baseY - 28 * scale, 20 * scale, 26 * scale);
            // Head
            ctx.fillStyle = '#ffcc80';
            ctx.beginPath();
            ctx.arc(x, baseY - 34 * scale, 10 * scale, 0, Math.PI * 2);
            ctx.fill();
            // Hair (black)
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.arc(x, baseY - 37 * scale, 10 * scale, Math.PI, 0);
            ctx.fill();
            // Eyes
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(x - 3 * scale, baseY - 33 * scale, 1.5 * scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + 3 * scale, baseY - 33 * scale, 1.5 * scale, 0, Math.PI * 2);
            ctx.fill();
            // Smile
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(x, baseY - 29 * scale, 4 * scale, 0.1, Math.PI - 0.1);
            ctx.stroke();
            // Legs - walking animation
            const legOffset = walkFrame ? Math.sin(walkFrame * 0.15) * 4 : 0;
            ctx.fillStyle = '#37474f';
            ctx.fillRect(x - 7 * scale, baseY - 2 * scale, 5 * scale, 14 * scale + legOffset);
            ctx.fillRect(x + 2 * scale, baseY - 2 * scale, 5 * scale, 14 * scale - legOffset);
            // Arms
            ctx.strokeStyle = '#ffcc80';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x - 10 * scale, baseY - 24 * scale);
            ctx.lineTo(x - 16 * scale, baseY - 16 * scale);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x + 10 * scale, baseY - 24 * scale);
            ctx.lineTo(x + 16 * scale, baseY - 16 * scale);
            ctx.stroke();
        } else {
            // Sara - girl character
            // Dress body
            ctx.fillStyle = isSad ? '#ce93d8' : '#f48fb1';
            ctx.fillRect(x - 10 * scale, baseY - 26 * scale, 20 * scale, 24 * scale);
            // Dress triangle
            ctx.beginPath();
            ctx.moveTo(x - 12 * scale, baseY - 4 * scale);
            ctx.lineTo(x, baseY + 10 * scale);
            ctx.lineTo(x + 12 * scale, baseY - 4 * scale);
            ctx.closePath();
            ctx.fill();
            // Head
            ctx.fillStyle = '#ffcc80';
            ctx.beginPath();
            ctx.arc(x, baseY - 32 * scale, 10 * scale, 0, Math.PI * 2);
            ctx.fill();
            // Hair (long black)
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.arc(x, baseY - 35 * scale, 10 * scale, Math.PI, 0);
            ctx.fill();
            // Side hair
            ctx.fillRect(x - 10 * scale, baseY - 34 * scale, 3 * scale, 12 * scale);
            ctx.fillRect(x + 7 * scale, baseY - 34 * scale, 3 * scale, 12 * scale);
            // Eyes
            ctx.fillStyle = '#000';
            if (isSad) {
                // Sad eyes - half closed
                ctx.fillRect(x - 4 * scale, baseY - 31 * scale, 2.5 * scale, 1 * scale);
                ctx.fillRect(x + 1.5 * scale, baseY - 31 * scale, 2.5 * scale, 1 * scale);
            } else {
                ctx.beginPath();
                ctx.arc(x - 3 * scale, baseY - 32 * scale, 1.5 * scale, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + 3 * scale, baseY - 32 * scale, 1.5 * scale, 0, Math.PI * 2);
                ctx.fill();
            }
            // Mouth
            if (isSad) {
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(x, baseY - 27 * scale, 3 * scale, Math.PI + 0.2, -0.2);
                ctx.stroke();
            } else {
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(x, baseY - 28 * scale, 3 * scale, 0.1, Math.PI - 0.1);
                ctx.stroke();
            }
        }
    }

    function drawHearts() {
        hearts.forEach((h, i) => {
            h.y -= h.speed;
            h.life -= 0.015;
            h.scale += 0.01;
            ctx.save();
            ctx.globalAlpha = Math.max(0, h.life);
            ctx.font = `${16 * h.scale}px Arial`;
            ctx.textAlign = 'center';
            ctx.fillText('❤️', h.x, h.y);
            ctx.restore();
        });
        hearts = hearts.filter(h => h.life > 0);
    }

    function spawnHearts(x, y, count = 8) {
        for (let i = 0; i < count; i++) {
            hearts.push({
                x: x + (Math.random() - 0.5) * 30,
                y: y + (Math.random() - 0.5) * 10,
                speed: 0.8 + Math.random() * 1.2,
                life: 1,
                scale: 0.8 + Math.random() * 0.6
            });
        }
    }

    // ========== ANIMATION LOOP ==========
    function gameLoop() {
        frame++;
        ctx.clearRect(0, 0, W, H);

        drawSky();
        drawSun();
        drawClouds();
        drawGround();
        drawPath();
        drawTrees();
        drawFlowers();
        drawBench();

        // Draw characters
        if (scene !== 'title' && scene !== 'ending') {
            drawCharacter(sara.x, sara.y, false, sara.isSad, 0);
            drawCharacter(ali.x, ali.y, true, false, ali.walking ? frame : 0);

            // If Ali is close to Sara
            if (Math.abs(ali.x - sara.x) < 30 && Math.abs(ali.y - sara.y) < 20) {
                drawHearts();
            }
        }

        drawHearts();

        requestAnimationFrame(gameLoop);
    }

    // ========== ALI MOVEMENT ==========
    function moveAliTo(targetX, targetY, callback) {
        ali.targetX = targetX;
        ali.targetY = targetY;
        ali.walking = true;

        const moveInterval = setInterval(() => {
            let dx = ali.targetX - ali.x;
            let dy = ali.targetY - ali.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 3) {
                ali.x = ali.targetX;
                ali.y = ali.targetY;
                ali.walking = false;
                clearInterval(moveInterval);
                if (callback) callback();
                return;
            }

            ali.x += (dx / dist) * ali.speed;
            ali.y += (dy / dist) * ali.speed;
        }, 16);
    }

    // ========== DIALOGUE SYSTEM ==========
    function showDialogue(name, text, onDone) {
        scene = 'dialogue';
        dialogueBox.style.display = 'block';
        choicesContainer.style.display = 'none';
        speakerName.textContent = name;
        dialogueText.textContent = '';
        continueHint.style.display = 'block';
        typedLength = 0;
        isTyping = true;
        skipToEnd = false;

        if (typingTimer) clearInterval(typingTimer);
        
        let idx = 0;
        typingTimer = setInterval(() => {
            if (skipToEnd) {
                dialogueText.textContent = text;
                clearInterval(typingTimer);
                isTyping = false;
                return;
            }
            if (idx < text.length) {
                dialogueText.textContent += text[idx];
                idx++;
            } else {
                clearInterval(typingTimer);
                isTyping = false;
            }
        }, 25);

        // Click to continue
        const handler = () => {
            if (isTyping) {
                skipToEnd = true;
                return;
            }
            dialogueBox.style.display = 'none';
            dialogueBox.removeEventListener('click', handler);
            if (onDone) onDone();
        };
        dialogueBox.addEventListener('click', handler);
    }

    function showChoices(choices, callback) {
        scene = 'choice';
        choicesContainer.style.display = 'flex';
        dialogueBox.style.display = 'none';

        const btns = choicesContainer.querySelectorAll('.choice-btn');
        choices.forEach((c, i) => {
            if (i < btns.length) {
                btns[i].textContent = c.text;
                btns[i].className = 'choice-btn' + (c.type ? ' ' + c.type : '');
                btns[i].style.display = 'block';
                btns[i].onclick = () => {
                    choicesContainer.style.display = 'none';
                    if (callback) callback(i);
                };
            }
        });

        // Hide extra buttons
        for (let i = choices.length; i < btns.length; i++) {
            btns[i].style.display = 'none';
        }
    }

        score += pts;
